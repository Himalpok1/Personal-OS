# Base/production shape: no ports published anywhere. On the i5, Tailscale
# Serve fronts the API from within the tailnet — it does not need a
# host-published port. See docker-compose.dev.yml for the local-dev overlay
# that adds localhost-only bindings for host-side tooling.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD must be set in .env}
      POSTGRES_DB: personalos
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD must be set in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - personalos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personalos"]
      interval: 5s
      timeout: 5s
      retries: 10

  # api/worker build their own DATABASE_URL from the same POSTGRES_APP_PASSWORD
  # rather than reusing the host-facing DATABASE_URL from .env: inside the
  # compose network Postgres is reachable at the service name `postgres`, not
  # at the host's 127.0.0.1 that .env's DATABASE_URL points host-side tools at.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://posops_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set in .env}@postgres:5432/personalos
      PORT: ${PORT:-3000}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?CREDENTIALS_ENCRYPTION_KEY must be set in .env}
      # Defaults to the local Metro dev-server ports so a Mac-side docker
      # compose run works with no extra .env changes; production overrides
      # this to the deployed web service's real Tailscale Serve origin.
      WEB_APP_ORIGIN: ${WEB_APP_ORIGIN:-http://localhost:8081,http://localhost:8082,http://localhost:19006}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - personalos

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://posops_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set in .env}@postgres:5432/personalos
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?CREDENTIALS_ENCRYPTION_KEY must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - personalos

  # Static SPA build (see apps/mobile/Dockerfile) -- no Postgres dependency
  # at all, just a build-time API URL and a static file server. Not part of
  # Phase 0/1; added in Phase 2 for the always-on web deployment (see
  # docs/STATUS.md's Phase 2 entry, decision 6).
  web:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set in .env}
    restart: unless-stopped
    networks:
      - personalos

networks:
  personalos:

volumes:
  postgres_data:
