# Base/production shape: no ports published anywhere. On the i5, Tailscale
# Serve fronts the API from within the tailnet — it does not need a
# host-published port. See docker-compose.dev.yml for the local-dev overlay
# that adds localhost-only bindings for host-side tooling.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD must be set in .env}
      POSTGRES_DB: personalos
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD must be set in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - personalos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personalos"]
      interval: 5s
      timeout: 5s
      retries: 10

  # api/worker build their own DATABASE_URL from the same POSTGRES_APP_PASSWORD
  # rather than reusing the host-facing DATABASE_URL from .env: inside the
  # compose network Postgres is reachable at the service name `postgres`, not
  # at the host's 127.0.0.1 that .env's DATABASE_URL points host-side tools at.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://posops_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set in .env}@postgres:5432/personalos
      PORT: ${PORT:-3000}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?CREDENTIALS_ENCRYPTION_KEY must be set in .env}
      # Defaults to the local Metro dev-server ports so a Mac-side docker
      # compose run works with no extra .env changes; production overrides
      # this to the deployed web service's real Tailscale Serve origin.
      WEB_APP_ORIGIN: ${WEB_APP_ORIGIN:-http://localhost:8081,http://localhost:8082,http://localhost:19006}
      AUDIO_STORAGE_PATH: /data/audio
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?GOOGLE_OAUTH_CLIENT_ID must be set in .env}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?GOOGLE_OAUTH_CLIENT_SECRET must be set in .env}
      # Google Health OAuth (Phase 6). Deliberately `:-` (optional), not `:?`
      # (required) like the Calendar pair above: production has no Health
      # credentials yet, and a rollout must not crash-loop before they exist.
      # Absent config degrades to 409 health_not_configured at the route.
      GOOGLE_HEALTH_OAUTH_CLIENT_ID: ${GOOGLE_HEALTH_OAUTH_CLIENT_ID:-}
      GOOGLE_HEALTH_OAUTH_CLIENT_SECRET: ${GOOGLE_HEALTH_OAUTH_CLIENT_SECRET:-}
      GOOGLE_HEALTH_OAUTH_REDIRECT_URI: ${GOOGLE_HEALTH_OAUTH_REDIRECT_URI:-}
      # Gmail OAuth (Phase 7 Checkpoint 7.2). Same `:-` (optional) form as the
      # Health trio above, and for the same load-bearing reason: production has
      # no Gmail credentials, and a rollout must not crash-loop before they
      # exist. Absent config degrades to 409 mail_not_configured at the route.
      #
      # api only in 7.2 -- apps/worker has no mail code yet, so passing these to
      # it would be config for something that does not exist. Checkpoint 7.3
      # adds the worker passthrough alongside the sync engine that needs it.
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:-}
      GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET:-}
      GMAIL_OAUTH_REDIRECT_URI: ${GMAIL_OAUTH_REDIRECT_URI:-}
    volumes:
      - audio_data:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
    # Checkpoint 8.1, Lane F. Reuses the EXISTING GET /health -- no new endpoint.
    #
    # Asserts the BODY, not the status code, and the distinction is load-bearing:
    # /health always replies 200 (apps/api/src/server.ts), reporting trouble as
    # `status: "degraded"` in the payload. A `curl -f`-style check would
    # therefore pass while the API could not reach Postgres at all.
    #
    # It deliberately IGNORES `worker.stale`. A dead worker is a real problem,
    # but it is not THIS container's problem, and marking the API unhealthy for
    # it would let Docker restart a perfectly good API while changing nothing
    # about the worker. ADR-055 already assigns worker-staleness alerting to the
    # API process itself, which is the mechanism that actually reports it.
    #
    # `node -e` rather than curl or wget: the runtime image is node:22-alpine,
    # which ships neither curl nor a wget that can parse JSON. Node is already
    # PID 1 here, so this adds no dependency.
    # start_period covers boot; nothing depends_on api, so this changes no
    # startup ordering.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>r.json()).then(b=>process.exit(b.status==='ok'?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - personalos

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://posops_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set in .env}@postgres:5432/personalos
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?CREDENTIALS_ENCRYPTION_KEY must be set in .env}
      AUDIO_STORAGE_PATH: /data/audio
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?GOOGLE_OAUTH_CLIENT_ID must be set in .env}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?GOOGLE_OAUTH_CLIENT_SECRET must be set in .env}
      # Google Health (Phase 6). `:-` rather than `:?` for the same reason the
      # api service uses it: a rollout must not hard-fail before the
      # credentials exist, and the worker's env schema makes both optional.
      GOOGLE_HEALTH_OAUTH_CLIENT_ID: ${GOOGLE_HEALTH_OAUTH_CLIENT_ID:-}
      GOOGLE_HEALTH_OAUTH_CLIENT_SECRET: ${GOOGLE_HEALTH_OAUTH_CLIENT_SECRET:-}
      # Gmail OAuth (Phase 7 Checkpoint 7.3). The worker refreshes a mail access
      # token inline from the sync pass, exactly as it does for Health, so it
      # needs the client pair. NOT the redirect URI: only apps/api mints
      # authorization URLs and handles the callback.
      #
      # `:-` for the same reason as every optional pair above -- it renders an
      # EMPTY STRING rather than omitting the key, which apps/worker's
      # `optionalNonEmpty()` treats as absent. A plain `z.string().min(1)
      # .optional()` would throw on "" and kill the worker at import on a host
      # with no mail credentials, which is production today.
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:-}
      GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET:-}
      # The IANA zone the scheduled mail digest is generated for (Phase 7
      # Checkpoint 7.4). mail_digests is keyed on (digest_date, timezone) and a
      # cron has nobody to ask, so the zone is configuration. Unset falls back to
      # UTC -- a correct, boring answer rather than a guessed one.
      MAIL_DIGEST_TIMEZONE: ${MAIL_DIGEST_TIMEZONE:-}
    volumes:
      - audio_data:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - personalos

  # Static SPA build (see apps/mobile/Dockerfile) -- no Postgres dependency
  # at all, just a build-time API URL and a static file server. Not part of
  # Phase 0/1; added in Phase 2 for the always-on web deployment (see
  # docs/STATUS.md's Phase 2 entry, decision 6).
  web:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL must be set in .env}
    restart: unless-stopped
    networks:
      - personalos

networks:
  personalos:

volumes:
  postgres_data:
  # Shared between api and worker -- see AUDIO_STORAGE_PATH in
  # apps/api/src/env.ts's comment for why they need the same mount point.
  audio_data:
