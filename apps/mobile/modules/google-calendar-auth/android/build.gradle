plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.googlecalendarauth'
version = '0.1.0'

android {
  namespace "expo.modules.googlecalendarauth"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Identity.getAuthorizationClient() -- the current, non-deprecated Google
  // Identity Services Authorization API. Not the legacy GoogleSignIn SDK.
  implementation 'com.google.android.gms:play-services-auth:21.6.0'
}
