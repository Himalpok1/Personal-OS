packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.15"
  - "@expo/config-plugins@57.0.8"
  - "@expo/metro-runtime@57.0.10"
  - "@expo/prebuild-config@57.0.12"
  - "@expo/router-server@57.0.6"
  - "@expo/ui@57.0.11"
  - babel-preset-expo@57.0.7
  - expo-asset@57.0.11
  - expo-constants@57.0.11 || 57.0.12
  - expo-file-system@57.0.3
  - expo-linking@57.0.6
  - expo-modules-autolinking@57.0.10
  - expo-modules-core@57.0.11
  - expo-router@57.0.13
  - expo-server@57.0.3
  - expo@57.0.13
  - "@ai-sdk/xai@4.0.40"
  - expo-notifications@57.0.12
# react-native-css-interop (nativewind/babel) references this Babel plugin by bare name without
# declaring it (Checkpoint 10.0 recorded debt). It reaches the tree only transitively, so hoist one
# real copy to the root node_modules: the name then resolves from anywhere -- the preset dir, the
# app dir, gradle's bundling step -- in every install layout, local and EAS alike (Checkpoint 10.2).
publicHoistPattern:
  - "@babel/plugin-transform-react-jsx"
